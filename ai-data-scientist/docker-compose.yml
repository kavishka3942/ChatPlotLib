services:
  ui:
    build: ./ui
    ports:
      - "8080:8080"
    volumes:
      - ./ui:/app
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - MINIO_ENDPOINT=minio:9000
      - SANDBOX_HOST=sandbox
    depends_on:
      - minio
      - sandbox

  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    environment:
      - SANDBOX_MODE=docker

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
